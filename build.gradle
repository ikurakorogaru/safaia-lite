plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}
version = '1.2.0-lite'
group = 'com.safaia'
base { archivesName = 'safaia' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.159.0+26.2'
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java { withSourcesJar() }
jar { from('LICENSE') { rename { 'LICENSE_safaia' } } }

tasks.register('verifyCore', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.client.CoreChecks'
}
tasks.named('check') { dependsOn 'verifyCore' }
